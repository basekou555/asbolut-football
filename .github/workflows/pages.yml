name: Deploy Absolut Coach to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/v2
          cp index.html styles.css profile.js players.js eras.js content.js core.js match.js coach.js player.js ui.js _site/
          cp v2/index.html v2/labo.html v2/style.css v2/moteur.js v2/coach.js v2/ecrans.js v2/ecransCoach.js _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
