<title>Coquilles vides — Absolut Coach 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0b1210; --panel:#12201a; --panel-2:#182a22; --line:#26382f;
    --cream:#ece8d8; --muted:#94a094; --gold:#c9a24b; --gold-dim:#8a7238;
    --red:#c0485a; --amber:#d39b3c; --sage:#4f9a6a;
    --ui:'Inter',system-ui,sans-serif; --display:'Bebas Neue',Impact,sans-serif; --narr:'Libre Baskerville',Georgia,serif;
  }
  :root[data-mode="joueur"]{ --bg:#101422; --panel:#171c30; --panel-2:#1f2540; --line:#2b3350; --gold:#e0b64a; --sage:#5da0c9; --muted:#9aa2bd; }
  body{ background:var(--bg); color:var(--cream); font-family:var(--ui); font-size:15px; line-height:1.55; transition:background .2s; }
  .wrap{ max-width:760px; margin:0 auto; padding-inline:16px; padding-block:20px 60px; }
  h1{ font-family:var(--display); font-size:clamp(28px,6vw,44px); line-height:1; letter-spacing:.02em; margin:0 0 4px; }
  h2{ font-family:var(--display); font-size:clamp(22px,4.4vw,30px); letter-spacing:.03em; margin:0 0 2px; line-height:1.05; text-wrap:balance; }
  h3{ font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--gold); margin:18px 0 6px; font-weight:600; }
  p{ margin:0 0 10px; }
  .narr{ font-family:var(--narr); font-size:14.5px; color:#d9d4c3; }
  .sub{ color:var(--muted); font-size:12.5px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin:0 0 14px; }
  .modes{ display:flex; gap:8px; margin:0 0 12px; }
  .modes button{ flex:1; font:inherit; font-weight:600; font-size:13px; padding:9px; border-radius:8px; cursor:pointer;
    background:var(--panel-2); color:var(--cream); border:1px solid var(--line); }
  .modes button[aria-pressed="true"]{ background:var(--gold); color:#14150f; border-color:var(--gold); }
  .nav{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
  .nav button{ font:inherit; font-size:12px; padding:5px 10px; border-radius:99px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--line); }
  .nav button[aria-pressed="true"]{ color:#14150f; background:var(--cream); border-color:var(--cream); font-weight:600; }
  .opt{ display:block; width:100%; text-align:left; font:inherit; color:var(--cream); background:var(--panel-2);
    border:1px solid var(--line); border-left:3px solid var(--gold-dim); border-radius:9px; padding:12px 14px; margin:0 0 8px; cursor:pointer; }
  .opt:hover{ border-left-color:var(--gold); background:#1d3227; }
  :root[data-mode="joueur"] .opt:hover{ background:#232a49; }
  .opt b{ display:block; font-size:14.5px; margin-bottom:3px; }
  .opt .two{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; margin-top:6px; }
  .opt .foot{ color:var(--sage); }
  .opt .vie{ color:var(--amber); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; margin:0 0 10px; }
  .kv dt{ color:var(--muted); white-space:nowrap; }
  .kv dd{ margin:0; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); }
  .chip.good{ color:var(--sage); } .chip.bad{ color:var(--red); } .chip.warn{ color:var(--amber); }
  .big{ font-family:var(--display); font-size:46px; line-height:1; color:var(--gold); }
  .score{ display:flex; align-items:baseline; gap:10px; }
  .note{ border-top:1px dashed var(--line); margin-top:14px; padding-top:10px; font-size:12px; color:var(--muted); }
  .note b{ color:var(--gold-dim); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:620px){ .grid2{ grid-template-columns:1fr; } }
  .shop{ display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:13px; align-items:center; }
  .shop i{ color:var(--muted); font-style:normal; font-size:12px; }
  .jrn{ font-size:12.5px; border-left:2px solid var(--line); padding-left:12px; }
  .jrn div{ margin-bottom:6px; }
  .jrn span{ color:var(--gold-dim); }
  .rank{ display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; font-size:13px; align-items:baseline; }
  .rank b{ font-family:var(--display); font-size:20px; color:var(--gold); }
  ol{ padding-left:18px; margin:0 0 10px; } li{ margin-bottom:5px; }
  .step{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  [hidden]{ display:none!important; }
</style>

</div>

let mode = 'joueur', cur = 'creation';
function setMode(m){
  mode = m; cur = S[m][0][0];
  document.documentElement.setAttribute('data-mode', m);
  document.getElementById('mJ').setAttribute('aria-pressed', m === 'joueur');
  document.getElementById('mC').setAttribute('aria-pressed', m === 'coach');
  draw();
}
function go(id){ cur = id; draw(); }
function draw(){
  const nav = document.getElementById('nav');
  nav.innerHTML = S[mode].map(([id, label]) =>
    `<button aria-pressed="${id === cur}" onclick="go('${id}')">${label}</button>`).join('');
  document.getElementById('screens').innerHTML = V[mode][cur] || '<div class="card sub">Écran à écrire.</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
draw();
</script>
