<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0b1210; --panel:#12201a; --panel-2:#182a22; --line:#26382f;
    --cream:#ece8d8; --muted:#94a094; --gold:#c9a24b; --gold-dim:#8a7238;
    --red:#c0485a; --amber:#d39b3c; --sage:#4f9a6a;
    --ui:'Inter',system-ui,sans-serif; --display:'Bebas Neue',Impact,sans-serif; --narr:'Libre Baskerville',Georgia,serif;
  }
  :root[data-mode="joueur"]{ --bg:#101422; --panel:#171c30; --panel-2:#1f2540; --line:#2b3350; --gold:#e0b64a; --sage:#5da0c9; --muted:#9aa2bd; }
  body{ background:var(--bg); color:var(--cream); font-family:var(--ui); font-size:15px; line-height:1.5; transition:background .2s; }
  .wrap{ max-width:780px; margin:0 auto; padding-inline:16px; padding-block:20px 60px; }
  h1{ font-family:var(--display); font-size:clamp(28px,6vw,44px); line-height:1; letter-spacing:.02em; margin:0 0 4px; }
  h2{ font-family:var(--display); font-size:clamp(23px,4.6vw,32px); letter-spacing:.03em; margin:0 0 8px; line-height:1.03; text-wrap:balance; }
  h3{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:18px 0 8px; font-weight:600; }
  p{ margin:0 0 10px; }
  .narr{ font-family:var(--narr); font-size:14px; color:#d9d4c3; }
  .sub{ color:var(--muted); font-size:12.5px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin:0 0 14px; }
  .modes{ display:flex; gap:8px; margin:0 0 12px; }
  .modes button{ flex:1; font:inherit; font-weight:600; font-size:13px; padding:9px; border-radius:8px; cursor:pointer;
    background:var(--panel-2); color:var(--cream); border:1px solid var(--line); }
  .modes button[aria-pressed="true"]{ background:var(--gold); color:#14150f; border-color:var(--gold); }
  .nav{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
  .nav button{ font:inherit; font-size:12px; padding:5px 10px; border-radius:99px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--line); }
  .nav button[aria-pressed="true"]{ color:#14150f; background:var(--cream); border-color:var(--cream); font-weight:600; }

  /* options */
  .opt{ display:grid; grid-template-columns:44px 1fr; gap:12px; width:100%; text-align:left; font:inherit; color:var(--cream);
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 8px; cursor:pointer; align-items:start; }
  .opt:hover{ border-color:var(--gold-dim); background:#1d3227; }
  :root[data-mode="joueur"] .opt:hover{ background:#232a49; }
  .opt .ico{ font-size:27px; line-height:1.05; text-align:center; }
  .opt b{ display:block; font-size:14.5px; margin-bottom:2px; }
  .pills{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .pill{ font-size:11.5px; padding:2px 8px; border-radius:99px; border:1px solid transparent; white-space:nowrap; }
  .pill.foot{ color:var(--sage); border-color:color-mix(in srgb, var(--sage) 45%, transparent); background:color-mix(in srgb, var(--sage) 12%, transparent); }
  .pill.vie{ color:var(--amber); border-color:color-mix(in srgb, var(--amber) 45%, transparent); background:color-mix(in srgb, var(--amber) 12%, transparent); }
  .pill.risk{ color:var(--red); border-color:color-mix(in srgb, var(--red) 45%, transparent); background:color-mix(in srgb, var(--red) 12%, transparent); }
  .pill.neutre{ color:var(--muted); border-color:var(--line); }

  /* faits de match / timeline */
  .tl{ display:grid; gap:4px; margin:6px 0 10px; }
  .tl div{ display:grid; grid-template-columns:38px 22px 1fr; gap:8px; align-items:baseline; font-size:13px;
    padding:5px 8px; border-radius:7px; background:var(--panel-2); }
  .tl .min{ color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .tl .me{ outline:1px solid var(--gold-dim); }

  /* gros chiffres */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px; margin:10px 0 4px; }
  .stats div{ background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 10px; text-align:center; }
  .stats .v{ font-family:var(--display); font-size:29px; line-height:1; color:var(--gold); }
  .stats .k{ font-size:10.5px; color:var(--muted); letter-spacing:.04em; margin-top:2px; }
  .score{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .score .big{ font-family:var(--display); font-size:52px; line-height:1; color:var(--gold); }

  /* liens & chantiers en lignes avec icône */
  .st{ display:grid; gap:5px; }
  .st div{ display:grid; grid-template-columns:30px 118px 1fr; gap:8px; align-items:baseline; font-size:13px; }
  .st .i{ font-size:17px; text-align:center; }
  .st .n{ color:var(--muted); font-size:12px; }
  .st .arrow{ color:var(--sage); } .st .down{ color:var(--red); }
  @media(max-width:560px){ .st div{ grid-template-columns:26px 1fr; } .st .n{ grid-column:2; } .st .w{ grid-column:2; } }

  /* boutique */
  .shop{ display:grid; gap:7px; }
  .shop div{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; font-size:13px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .shop .i{ font-size:20px; text-align:center; }
  .shop i{ color:var(--muted); font-style:normal; font-size:11.5px; display:block; }
  .shop .p{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .shop .off{ opacity:.45; }
  .tabs{ display:flex; gap:6px; margin:0 0 10px; }
  .tabs button{ font:inherit; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:99px; cursor:pointer;
    background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }
  .tabs button[aria-pressed="true"]{ background:var(--cream); color:#14150f; border-color:var(--cream); }

  /* bilan */
  .bloc{ display:grid; grid-template-columns:40px 1fr; gap:12px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:13px 15px; margin:0 0 9px; }
  .bloc .i{ font-size:26px; text-align:center; line-height:1; }
  .bloc h4{ margin:0 0 4px; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); }
  .bloc.perdu{ border-left:3px solid var(--red); } .bloc.perdu h4{ color:var(--red); }
  .bloc.gagne{ border-left:3px solid var(--sage); } .bloc.gagne h4{ color:var(--sage); }
  .bloc.suite{ border-left:3px solid var(--gold-dim); }

  .trophies{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .trophies span{ font-size:12.5px; padding:4px 10px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); }
  .rank{ display:grid; gap:7px; }
  .rank div{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13px; }
  .rank .m{ font-size:21px; text-align:center; }
  .rank .tag{ font-size:11px; color:var(--muted); white-space:nowrap; }
  .jrn{ display:grid; gap:5px; font-size:12.5px; }
  .jrn div{ display:grid; grid-template-columns:70px 22px 1fr; gap:8px; align-items:baseline; }
  .jrn .d{ color:var(--gold-dim); font-size:11px; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; margin:0 0 10px; }
  .kv dt{ color:var(--muted); white-space:nowrap; } .kv dd{ margin:0; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); }
  .chip.on{ border-color:var(--gold); color:var(--gold); }
  .note{ border-top:1px dashed var(--line); margin-top:14px; padding-top:10px; font-size:12px; color:var(--muted); }
  .note b{ color:var(--gold-dim); }
  .step{ font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
  [hidden]{ display:none!important; }
</style>

let mode = 'joueur', cur = 'origine';
function setMode(m){
  mode = m; cur = S[m][0][0];
  document.documentElement.setAttribute('data-mode', m);
  document.getElementById('mJ').setAttribute('aria-pressed', m === 'joueur');
  document.getElementById('mC').setAttribute('aria-pressed', m === 'coach');
  draw();
}
function go(id){ cur = id; draw(); }
function shop(which, btn){
  const a = document.getElementById('shopA'), v = document.getElementById('shopV');
  if(!a || !v) return;
  a.hidden = which === 'v'; v.hidden = which === 'a';
  [...btn.parentElement.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
}
function draw(){
  document.getElementById('nav').innerHTML = S[mode].map(([id, label]) =>
    `<button aria-pressed="${id === cur}" onclick="go('${id}')">${label}</button>`).join('');
  document.getElementById('screens').innerHTML = V[mode][cur] || '<div class="card sub">Écran à écrire.</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
draw();
</script>
